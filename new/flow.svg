<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b1fa2"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#f8f9fb"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Multi-Agent Paper Review Pipeline</text>

  <!-- ── INPUT ── -->
  <rect x="380" y="55" width="200" height="50" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="480" y="75" text-anchor="middle" fill="white" font-weight="bold">Academic Paper</text>
  <text x="480" y="95" text-anchor="middle" fill="#aac4ff" font-size="11">body only (refs stripped)</text>

  <!-- Arrow down to Phase 1 label -->
  <line x1="480" y1="105" x2="480" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 1 banner -->
  <rect x="50" y="132" width="860" height="26" rx="5" fill="#e8eaf6"/>
  <text x="480" y="150" text-anchor="middle" font-size="12" fill="#3949ab" font-weight="bold">Phase 1 — Parallel Independent Review</text>

  <!-- ── PHASE 1 AGENTS ── -->

  <!-- Harsh Critic -->
  <rect x="55" y="174" width="185" height="100" rx="8" fill="#c62828" filter="url(#shadow)"/>
  <text x="148" y="196" text-anchor="middle" fill="white" font-weight="bold">Harsh Critic</text>
  <line x1="70" y1="203" x2="225" y2="203" stroke="#ef9a9a" stroke-width="0.8"/>
  <text x="148" y="219" text-anchor="middle" fill="#ffcdd2" font-size="11">Maximally skeptical read</text>
  <text x="148" y="235" text-anchor="middle" fill="#ffcdd2" font-size="11">Finds every flaw, gap,</text>
  <text x="148" y="251" text-anchor="middle" fill="#ffcdd2" font-size="11">and unsupported claim</text>
  <text x="148" y="267" text-anchor="middle" fill="#ef9a9a" font-size="10">model: HARSH_MODEL</text>

  <!-- Neutral Reviewer -->
  <rect x="265" y="174" width="185" height="100" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
  <text x="358" y="196" text-anchor="middle" fill="white" font-weight="bold">Neutral Reviewer</text>
  <line x1="280" y1="203" x2="435" y2="203" stroke="#a5d6a7" stroke-width="0.8"/>
  <text x="358" y="219" text-anchor="middle" fill="#c8e6c9" font-size="11">Standard ICLR criteria</text>
  <text x="358" y="235" text-anchor="middle" fill="#c8e6c9" font-size="11">Soundness, novelty,</text>
  <text x="358" y="251" text-anchor="middle" fill="#c8e6c9" font-size="11">clarity, reproducibility</text>
  <text x="358" y="267" text-anchor="middle" fill="#a5d6a7" font-size="10">model: default</text>

  <!-- Spark -->
  <rect x="475" y="174" width="185" height="100" rx="8" fill="#e65100" filter="url(#shadow)"/>
  <text x="568" y="196" text-anchor="middle" fill="white" font-weight="bold">Spark</text>
  <line x1="490" y1="203" x2="645" y2="203" stroke="#ffcc80" stroke-width="0.8"/>
  <text x="568" y="219" text-anchor="middle" fill="#ffe0b2" font-size="11">Identifies hidden potential</text>
  <text x="568" y="235" text-anchor="middle" fill="#ffe0b2" font-size="11">and exciting implications</text>
  <text x="568" y="251" text-anchor="middle" fill="#ffe0b2" font-size="11">beyond surface results</text>
  <text x="568" y="267" text-anchor="middle" fill="#ffcc80" font-size="10">model: default</text>

  <!-- Human Finder -->
  <rect x="685" y="174" width="210" height="100" rx="8" fill="#4527a0" filter="url(#shadow)"/>
  <text x="790" y="196" text-anchor="middle" fill="white" font-weight="bold">Human Finder</text>
  <line x1="700" y1="203" x2="880" y2="203" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="790" y="219" text-anchor="middle" fill="#d1c4e9" font-size="11">Retrieves real reviews of</text>
  <text x="790" y="235" text-anchor="middle" fill="#d1c4e9" font-size="11">similar past papers as</text>
  <text x="790" y="251" text-anchor="middle" fill="#d1c4e9" font-size="11">grounding reference</text>
  <text x="790" y="267" text-anchor="middle" fill="#ce93d8" font-size="10">tools: read_file, search_file, grep_files</text>

  <!-- Fan-out arrows from paper to agents -->
  <line x1="480" y1="105" x2="148" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="358" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="568" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="790" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ── HUMAN REVIEWS STORE (under Human Finder) ── -->
  <rect x="668" y="290" width="244" height="84" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.2"/>
  <text x="790" y="310" text-anchor="middle" fill="#6a1b9a" font-weight="bold" font-size="12">Human Reviews Store</text>
  <line x1="680" y1="317" x2="900" y2="317" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="790" y="333" text-anchor="middle" fill="#6a1b9a" font-size="11">2000+ ICLR papers</text>
  <text x="790" y="349" text-anchor="middle" fill="#6a1b9a" font-size="11">search_file + grep_files</text>
  <text x="790" y="365" text-anchor="middle" fill="#6a1b9a" font-size="11">→ top-k human reviews</text>

  <!-- Arrow Human Finder → Store -->
  <line x1="790" y1="274" x2="790" y2="290" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>

  <!-- ── COLLECT OUTPUTS ── -->
  <line x1="148" y1="274" x2="148" y2="490" stroke="#555" stroke-width="1.2"/>
  <line x1="358" y1="274" x2="358" y2="490" stroke="#555" stroke-width="1.2"/>
  <line x1="568" y1="274" x2="568" y2="490" stroke="#555" stroke-width="1.2"/>
  <line x1="790" y1="274" x2="630" y2="274" stroke="#555" stroke-width="1.2"/>
  <line x1="630" y1="274" x2="630" y2="490" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="490" x2="630" y2="490" stroke="#555" stroke-width="1.2"/>
  <line x1="389" y1="490" x2="389" y2="510" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2 banner -->
  <rect x="50" y="512" width="860" height="26" rx="5" fill="#e8f5e9"/>
  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">Phase 2 — Synthesis &amp; Judgment</text>

  <!-- ── MERGER ── -->
  <rect x="249" y="550" width="280" height="100" rx="8" fill="#0277bd" filter="url(#shadow)"/>
  <text x="389" y="572" text-anchor="middle" fill="white" font-weight="bold">Merger</text>
  <line x1="264" y1="579" x2="514" y2="579" stroke="#81d4fa" stroke-width="0.8"/>
  <text x="389" y="595" text-anchor="middle" fill="#b3e5fc" font-size="11">Cross-checks Harsh Critic claims</text>
  <text x="389" y="611" text-anchor="middle" fill="#b3e5fc" font-size="11">against paper; produces final verdict</text>
  <text x="389" y="627" text-anchor="middle" fill="#b3e5fc" font-size="11">tools: read_file, summarizer</text>
  <text x="389" y="641" text-anchor="middle" fill="#81d4fa" font-size="10">model: MERGER_MODEL · score in &lt;pineapple&gt; · decision in &lt;orange&gt;</text>

  <line x1="389" y1="538" x2="389" y2="550" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="389" y1="650" x2="389" y2="670" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── OUTPUTS ── -->
  <!-- Narrative review -->
  <rect x="60" y="670" width="170" height="24" rx="5" fill="#37474f" filter="url(#shadow)"/>
  <text x="145" y="687" text-anchor="middle" fill="white" font-size="11">Narrative review (.md)</text>

  <!-- Score -->
  <rect x="305" y="670" width="170" height="24" rx="5" fill="#37474f" filter="url(#shadow)"/>
  <text x="390" y="687" text-anchor="middle" fill="white" font-size="11">Numeric score (1–10)</text>

  <!-- Decision -->
  <rect x="550" y="670" width="170" height="24" rx="5" fill="#37474f" filter="url(#shadow)"/>
  <text x="635" y="687" text-anchor="middle" fill="white" font-size="11">Accept / Reject decision</text>

  <!-- fan-out from merger to outputs -->
  <line x1="389" y1="670" x2="145" y2="670" stroke="#555" stroke-width="1.2"/>
  <line x1="389" y1="670" x2="635" y2="670" stroke="#555" stroke-width="1.2"/>

  <!-- note lines down from outputs -->
  <line x1="145" y1="670" x2="145" y2="694" stroke="#555" stroke-width="1"/>
  <line x1="390" y1="670" x2="390" y2="694" stroke="#555" stroke-width="1"/>
  <line x1="635" y1="670" x2="635" y2="694" stroke="#555" stroke-width="1"/>

</svg>
