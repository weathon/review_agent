<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b1fa2"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="660" fill="#f8f9fb"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Multi-Agent Paper Review Pipeline</text>

  <!-- ── INPUT ── -->
  <rect x="380" y="55" width="200" height="50" rx="8" fill="#1a1a2e" filter="url(#shadow)"/>
  <text x="480" y="75" text-anchor="middle" fill="white" font-weight="bold">Academic Paper</text>
  <text x="480" y="95" text-anchor="middle" fill="#aac4ff" font-size="11">body only (refs stripped)</text>

  <!-- Arrow down to Phase 1 label -->
  <line x1="480" y1="105" x2="480" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 1 banner -->
  <rect x="50" y="132" width="860" height="26" rx="5" fill="#e8eaf6"/>
  <text x="480" y="150" text-anchor="middle" font-size="12" fill="#3949ab" font-weight="bold">Phase 1 — Parallel Independent Review</text>

  <!-- ── PHASE 1 AGENTS ── -->

  <!-- Harsh Critic -->
  <rect x="55" y="174" width="185" height="88" rx="8" fill="#c62828" filter="url(#shadow)"/>
  <text x="148" y="196" text-anchor="middle" fill="white" font-weight="bold">Adversarial Critic</text>
  <line x1="70" y1="203" x2="225" y2="203" stroke="#ef9a9a" stroke-width="0.8"/>
  <text x="148" y="219" text-anchor="middle" fill="#ffcdd2" font-size="11">Maximally skeptical read</text>
  <text x="148" y="235" text-anchor="middle" fill="#ffcdd2" font-size="11">Finds every flaw, gap,</text>
  <text x="148" y="251" text-anchor="middle" fill="#ffcdd2" font-size="11">and unsupported claim</text>

  <!-- Neutral Reviewer -->
  <rect x="265" y="174" width="185" height="88" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
  <text x="358" y="196" text-anchor="middle" fill="white" font-weight="bold">Balanced Reviewer</text>
  <line x1="280" y1="203" x2="435" y2="203" stroke="#a5d6a7" stroke-width="0.8"/>
  <text x="358" y="219" text-anchor="middle" fill="#c8e6c9" font-size="11">Standard ICLR criteria</text>
  <text x="358" y="235" text-anchor="middle" fill="#c8e6c9" font-size="11">Soundness, novelty,</text>
  <text x="358" y="251" text-anchor="middle" fill="#c8e6c9" font-size="11">clarity, reproducibility</text>

  <!-- Spark Finder -->
  <rect x="475" y="174" width="185" height="88" rx="8" fill="#e65100" filter="url(#shadow)"/>
  <text x="568" y="196" text-anchor="middle" fill="white" font-weight="bold">Opportunity Finder</text>
  <line x1="490" y1="203" x2="645" y2="203" stroke="#ffcc80" stroke-width="0.8"/>
  <text x="568" y="219" text-anchor="middle" fill="#ffe0b2" font-size="11">Identifies hidden potential</text>
  <text x="568" y="235" text-anchor="middle" fill="#ffe0b2" font-size="11">and exciting implications</text>
  <text x="568" y="251" text-anchor="middle" fill="#ffe0b2" font-size="11">beyond surface results</text>

  <!-- Human Match Finder -->
  <rect x="685" y="174" width="210" height="88" rx="8" fill="#4527a0" filter="url(#shadow)"/>
  <text x="790" y="196" text-anchor="middle" fill="white" font-weight="bold">Human Match Finder</text>
  <line x1="700" y1="203" x2="880" y2="203" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="790" y="219" text-anchor="middle" fill="#d1c4e9" font-size="11">Retrieves real reviews of</text>
  <text x="790" y="235" text-anchor="middle" fill="#d1c4e9" font-size="11">similar past papers as</text>
  <text x="790" y="251" text-anchor="middle" fill="#d1c4e9" font-size="11">grounding reference</text>

  <!-- Fan-out arrows from paper to agents -->
  <line x1="480" y1="105" x2="148" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="358" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="568" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="480" y1="105" x2="790" y2="174" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ── RETRIEVAL BOX (under Human Finder) ── -->
  <rect x="668" y="278" width="244" height="100" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.2"/>
  <text x="790" y="298" text-anchor="middle" fill="#6a1b9a" font-weight="bold" font-size="12">Hybrid Retrieval</text>
  <line x1="680" y1="305" x2="900" y2="305" stroke="#ce93d8" stroke-width="0.8"/>
  <text x="790" y="321" text-anchor="middle" fill="#6a1b9a" font-size="11">BM25 keyword search</text>
  <text x="790" y="337" text-anchor="middle" fill="#6a1b9a" font-size="11">+ dense vector similarity</text>
  <text x="790" y="353" text-anchor="middle" fill="#6a1b9a" font-size="11">over 2000+ ICLR papers</text>
  <text x="790" y="369" text-anchor="middle" fill="#6a1b9a" font-size="11">→ top-k human reviews</text>

  <!-- Arrow Human Finder → Retrieval -->
  <line x1="790" y1="262" x2="790" y2="278" stroke="#7b1fa2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>

  <!-- ── COLLECT OUTPUTS ── -->
  <line x1="148" y1="262" x2="148" y2="460" stroke="#555" stroke-width="1.2"/>
  <line x1="358" y1="262" x2="358" y2="460" stroke="#555" stroke-width="1.2"/>
  <line x1="568" y1="262" x2="568" y2="460" stroke="#555" stroke-width="1.2"/>
  <line x1="790" y1="262" x2="630" y2="262" stroke="#555" stroke-width="1.2"/>
  <line x1="630" y1="262" x2="630" y2="460" stroke="#555" stroke-width="1.2"/>
  <line x1="148" y1="460" x2="630" y2="460" stroke="#555" stroke-width="1.2"/>
  <line x1="389" y1="460" x2="389" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2 banner -->
  <rect x="50" y="482" width="860" height="26" rx="5" fill="#e8f5e9"/>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">Phase 2 — Synthesis &amp; Judgment</text>

  <!-- ── MERGER ── -->
  <rect x="279" y="520" width="220" height="88" rx="8" fill="#0277bd" filter="url(#shadow)"/>
  <text x="389" y="542" text-anchor="middle" fill="white" font-weight="bold">Synthesis &amp; Judge</text>
  <line x1="294" y1="549" x2="484" y2="549" stroke="#81d4fa" stroke-width="0.8"/>
  <text x="389" y="565" text-anchor="middle" fill="#b3e5fc" font-size="11">Cross-checks Adversarial</text>
  <text x="389" y="581" text-anchor="middle" fill="#b3e5fc" font-size="11">claims against paper;</text>
  <text x="389" y="597" text-anchor="middle" fill="#b3e5fc" font-size="11">produces final verdict</text>

  <line x1="389" y1="508" x2="389" y2="520" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="389" y1="608" x2="389" y2="628" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── OUTPUTS ── -->
  <!-- Narrative review -->
  <rect x="80" y="628" width="170" height="24" rx="5" fill="#37474f" filter="url(#shadow)"/>
  <text x="165" y="645" text-anchor="middle" fill="white" font-size="11">Narrative review</text>

  <!-- Accept/Reject score -->
  <rect x="305" y="628" width="170" height="24" rx="5" fill="#37474f" filter="url(#shadow)"/>
  <text x="390" y="645" text-anchor="middle" fill="white" font-size="11">Numeric score (1–10)</text>

  <!-- Decision -->
  <rect x="530" y="628" width="170" height="24" rx="5" fill="#37474f" filter="url(#shadow)"/>
  <text x="615" y="645" text-anchor="middle" fill="white" font-size="11">Accept / Reject decision</text>

  <!-- fan-out from merger to outputs -->
  <line x1="389" y1="628" x2="165" y2="628" stroke="#555" stroke-width="1.2"/>
  <line x1="389" y1="628" x2="615" y2="628" stroke="#555" stroke-width="1.2"/>

  <!-- note lines down from outputs -->
  <line x1="165" y1="628" x2="165" y2="652" stroke="#555" stroke-width="1"/>
  <line x1="390" y1="628" x2="390" y2="652" stroke="#555" stroke-width="1"/>
  <line x1="615" y1="628" x2="615" y2="652" stroke="#555" stroke-width="1"/>

</svg>
