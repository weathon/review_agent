<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Times New Roman', Times, serif" font-size="15">
  <rect width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 1.4; }
      .paper { fill: #f4f1e8; stroke: #8a7a3a; }
      .reviewer { fill: #eaf3fb; stroke: #356ea0; }
      .anchor { fill: #f0e8f5; stroke: #6a3a8a; }
      .merger { fill: #fbeee6; stroke: #a0562c; }
      .output { fill: #e8f3ec; stroke: #2c7a4a; }
      .corpus { fill: #f5f5f5; stroke: #666; stroke-dasharray: 4 3; }
      .lbl { fill: #222; text-anchor: middle; }
      .sub { fill: #555; font-size: 12px; text-anchor: middle; font-style: italic; }
      .phase { fill: #888; font-size: 12px; letter-spacing: 2px; }
      .edge { stroke: #333; stroke-width: 1.3; fill: none; }
      .edge-dashed { stroke: #777; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <text x="490" y="28" class="lbl" font-size="17" font-weight="bold">Multi-Agent Paper Review with Comparative Calibration</text>

  <!-- Paper -->
  <rect x="40" y="220" width="140" height="70" rx="8" class="box paper"/>
  <text x="110" y="250" class="lbl" font-weight="bold">Paper</text>
  <text x="110" y="270" class="sub">(PDF text)</text>

  <!-- Phase 1 label -->
  <text x="420" y="70" class="phase" text-anchor="middle">PHASE 1  ·  INDEPENDENT PERSPECTIVES</text>

  <!-- Reviewers -->
  <rect x="260" y="95" width="180" height="60" rx="8" class="box reviewer"/>
  <text x="350" y="120" class="lbl" font-weight="bold">Harsh Critic</text>
  <text x="350" y="140" class="sub">adversarial weaknesses</text>

  <rect x="260" y="175" width="180" height="60" rx="8" class="box reviewer"/>
  <text x="350" y="200" class="lbl" font-weight="bold">Neutral Reviewer</text>
  <text x="350" y="220" class="sub">balanced assessment</text>

  <rect x="260" y="255" width="180" height="60" rx="8" class="box reviewer"/>
  <text x="350" y="280" class="lbl" font-weight="bold">Spark Finder</text>
  <text x="350" y="300" class="sub">novel contributions</text>

  <rect x="260" y="335" width="180" height="60" rx="8" class="box anchor"/>
  <text x="350" y="360" class="lbl" font-weight="bold">Human-Anchor Finder</text>
  <text x="350" y="380" class="sub">retrieves similar reviews</text>

  <!-- Human review corpus -->
  <rect x="40" y="335" width="180" height="60" rx="8" class="box corpus"/>
  <text x="130" y="360" class="lbl" font-weight="bold">Human Review Corpus</text>
  <text x="130" y="380" class="sub">prior ICLR reviews + scores</text>

  <!-- Paper -> reviewers -->
  <path d="M180,255 C220,150 240,130 260,125" class="edge" marker-end="url(#arrow)"/>
  <path d="M180,255 L260,205" class="edge" marker-end="url(#arrow)"/>
  <path d="M180,255 L260,285" class="edge" marker-end="url(#arrow)"/>
  <path d="M180,255 C220,340 240,360 260,365" class="edge" marker-end="url(#arrow)"/>

  <!-- Corpus -> anchor finder -->
  <path d="M220,365 L260,365" class="edge-dashed" marker-end="url(#arrow)"/>

  <!-- Phase 2 label -->
  <text x="640" y="70" class="phase" text-anchor="middle">PHASE 2  ·  SYNTHESIS</text>

  <!-- Merger -->
  <rect x="560" y="195" width="180" height="100" rx="8" class="box merger"/>
  <text x="650" y="225" class="lbl" font-weight="bold">Merger</text>
  <text x="650" y="248" class="sub">cross-checks claims</text>
  <text x="650" y="265" class="sub">against paper text</text>
  <text x="650" y="282" class="sub">+ calibrates to anchors</text>

  <!-- reviewer -> merger arrows -->
  <path d="M440,125 C500,135 520,180 560,215" class="edge" marker-end="url(#arrow)"/>
  <path d="M440,205 L560,235" class="edge" marker-end="url(#arrow)"/>
  <path d="M440,285 L560,265" class="edge" marker-end="url(#arrow)"/>
  <path d="M440,365 C500,340 520,310 560,285" class="edge" marker-end="url(#arrow)"/>

  <!-- Paper direct to merger (cross-check) -->
  <path d="M110,220 C110,160 400,40 650,80 L650,195" class="edge-dashed" marker-end="url(#arrow)"/>
  <text x="400" y="55" class="sub">paper text (verification)</text>

  <!-- Phase 3 label -->
  <text x="870" y="70" class="phase" text-anchor="middle">OUTPUT</text>

  <!-- Outputs -->
  <rect x="800" y="175" width="140" height="55" rx="8" class="box output"/>
  <text x="870" y="200" class="lbl" font-weight="bold">Consolidated</text>
  <text x="870" y="218" class="lbl" font-weight="bold">Review</text>

  <rect x="800" y="245" width="140" height="45" rx="8" class="box output"/>
  <text x="870" y="272" class="lbl" font-weight="bold">Score</text>

  <rect x="800" y="305" width="140" height="45" rx="8" class="box output"/>
  <text x="870" y="332" class="lbl" font-weight="bold">Accept / Reject</text>

  <!-- merger -> outputs -->
  <path d="M740,225 L800,205" class="edge" marker-end="url(#arrow)"/>
  <path d="M740,245 L800,265" class="edge" marker-end="url(#arrow)"/>
  <path d="M740,275 L800,325" class="edge" marker-end="url(#arrow)"/>

  <!-- Calibration callout -->
  <rect x="500" y="420" width="380" height="70" rx="8" class="box" fill="#fafaf5"/>
  <text x="690" y="443" class="lbl" font-weight="bold">Comparative Calibration</text>
  <text x="690" y="463" class="sub">Score is anchored to retrieved high- and low-scoring</text>
  <text x="690" y="479" class="sub">human-reviewed papers, not produced in isolation.</text>

  <path d="M650,420 L650,295" class="edge-dashed"/>
  <path d="M500,455 C400,455 350,410 350,395" class="edge-dashed"/>

  <!-- Legend -->
  <g transform="translate(40,430)">
    <text x="0" y="0" font-weight="bold" font-size="13">Legend</text>
    <rect x="0" y="12" width="18" height="12" class="box reviewer"/>
    <text x="24" y="22" font-size="12">LLM reviewer agent</text>
    <rect x="0" y="32" width="18" height="12" class="box anchor"/>
    <text x="24" y="42" font-size="12">Retrieval agent</text>
    <rect x="0" y="52" width="18" height="12" class="box merger"/>
    <text x="24" y="62" font-size="12">Synthesis agent</text>
    <line x1="160" y1="18" x2="200" y2="18" class="edge" marker-end="url(#arrow)"/>
    <text x="206" y="22" font-size="12">data flow</text>
    <line x1="160" y1="38" x2="200" y2="38" class="edge-dashed"/>
    <text x="206" y="42" font-size="12">reference / retrieval</text>
  </g>
</svg>
