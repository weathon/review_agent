<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1480" height="760" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d3b"/>
    </marker>
    <style>
      .box { stroke: #333; stroke-width: 1.5; rx: 10; ry: 10; }
      .title { font-size: 15px; font-weight: bold; fill: #111; }
      .sub   { font-size: 12px; fill: #333; }
      .tag   { font-size: 11px; fill: #555; font-style: italic; }
      .edge  { stroke: #333; stroke-width: 1.6; fill: none; }
      .edgeDashed { stroke: #8a6d3b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .label { font-size: 11px; fill: #333; }
      .stageLabel { font-size: 12px; fill: #777; font-weight: bold; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Stage labels -->
  <text x="110"  y="40" class="stageLabel" text-anchor="middle">INPUT</text>
  <text x="395"  y="40" class="stageLabel" text-anchor="middle">STAGE 1 — PARALLEL DUAL-PERSPECTIVE REVIEW</text>
  <text x="725"  y="40" class="stageLabel" text-anchor="middle">STAGE 2 — MERGING</text>
  <text x="1040" y="40" class="stageLabel" text-anchor="middle">STAGE 3 — CALIBRATED SCORING</text>
  <text x="1355" y="40" class="stageLabel" text-anchor="middle">OUTPUT</text>

  <!-- Input paper -->
  <rect x="30" y="260" width="160" height="90" class="box" fill="#eef5ff"/>
  <text x="110" y="295" class="title" text-anchor="middle">Paper</text>
  <text x="110" y="315" class="sub"   text-anchor="middle">(PDF → markdown,</text>
  <text x="110" y="331" class="sub"   text-anchor="middle">refs / appendix stripped)</text>

  <!-- Harsh Critic -->
  <rect x="280" y="140" width="230" height="120" class="box" fill="#ffecec"/>
  <text x="395" y="170" class="title" text-anchor="middle">Harsh Critic Agent</text>
  <text x="395" y="193" class="sub"   text-anchor="middle">High-recall weakness finder.</text>
  <text x="395" y="210" class="sub"   text-anchor="middle">Flags every potential issue;</text>
  <text x="395" y="227" class="sub"   text-anchor="middle">filtered later by the Merger.</text>
  <text x="395" y="248" class="tag"   text-anchor="middle">high-recall weakness mining</text>

  <!-- Strength Finder -->
  <rect x="280" y="360" width="230" height="120" class="box" fill="#e8f7ec"/>
  <text x="395" y="390" class="title" text-anchor="middle">Strength Finder Agent</text>
  <text x="395" y="413" class="sub"   text-anchor="middle">Neutral / charitable reviewer.</text>
  <text x="395" y="430" class="sub"   text-anchor="middle">Surfaces contributions,</text>
  <text x="395" y="447" class="sub"   text-anchor="middle">novelty, empirical merits.</text>
  <text x="395" y="468" class="tag"   text-anchor="middle">balances negativity bias</text>

  <!-- Merger -->
  <rect x="600" y="200" width="250" height="170" class="box" fill="#fff7e0"/>
  <text x="725" y="230" class="title" text-anchor="middle">Merger Agent</text>
  <text x="725" y="252" class="sub"   text-anchor="middle">Cross-checks each claim</text>
  <text x="725" y="268" class="sub"   text-anchor="middle">against the paper; drops</text>
  <text x="725" y="284" class="sub"   text-anchor="middle">spurious points; consolidates</text>
  <text x="725" y="300" class="sub"   text-anchor="middle">strengths + weaknesses.</text>
  <text x="725" y="321" class="sub"   text-anchor="middle">Emits review + compacted</text>
  <text x="725" y="337" class="sub"   text-anchor="middle">&lt;context&gt; block for Scorer.</text>
  <text x="725" y="358" class="tag"   text-anchor="middle">verification + aggregation (no scoring)</text>

  <!-- Scorer -->
  <rect x="915" y="200" width="250" height="170" class="box" fill="#ffe0ec"/>
  <text x="1040" y="230" class="title" text-anchor="middle">Scorer Agent</text>
  <text x="1040" y="252" class="sub"   text-anchor="middle">Reads merger review +</text>
  <text x="1040" y="268" class="sub"   text-anchor="middle">&lt;context&gt; only. Does not</text>
  <text x="1040" y="284" class="sub"   text-anchor="middle">re-read the paper.</text>
  <text x="1040" y="305" class="sub"   text-anchor="middle">Calibrates severity against</text>
  <text x="1040" y="321" class="sub"   text-anchor="middle">retrieved human-review anchors.</text>
  <text x="1040" y="358" class="tag"   text-anchor="middle">score + accept/reject decision</text>

  <!-- Calibration Search subagent -->
  <rect x="915" y="460" width="250" height="130" class="box" fill="#f0e8ff"/>
  <text x="1040" y="490" class="title" text-anchor="middle">Calibration-Search Subagent</text>
  <text x="1040" y="512" class="sub"   text-anchor="middle">Score-band filter → BM25 / dense</text>
  <text x="1040" y="529" class="sub"   text-anchor="middle">retrieval over human-review corpus.</text>
  <text x="1040" y="551" class="sub"   text-anchor="middle">args: query, low_score, high_score</text>
  <text x="1040" y="572" class="tag"   text-anchor="middle">returns anchor reviews (topic / quality / score)</text>

  <!-- Human review corpus -->
  <rect x="1215" y="480" width="180" height="90" class="box" fill="#f5f5f5" stroke-dasharray="4 3"/>
  <text x="1305" y="510" class="title" text-anchor="middle">Human-Review</text>
  <text x="1305" y="530" class="sub"   text-anchor="middle">Corpus (ICLR reviews)</text>
  <text x="1305" y="550" class="tag"   text-anchor="middle">avg-score indexed</text>

  <!-- Final output -->
  <rect x="1235" y="180" width="220" height="220" class="box" fill="#e6f4ff"/>
  <text x="1345" y="210" class="title" text-anchor="middle">Consolidated Review</text>
  <text x="1345" y="233" class="sub"   text-anchor="middle">• strengths + weaknesses</text>
  <text x="1345" y="253" class="sub"   text-anchor="middle">• calibrated score ∈ [1,10]</text>
  <text x="1345" y="273" class="sub"   text-anchor="middle">• accept / reject decision</text>
  <line x1="1250" y1="288" x2="1440" y2="288" stroke="#9bbcd9" stroke-dasharray="3 3"/>
  <text x="1345" y="307" class="sub"   text-anchor="middle" font-weight="bold">Empirical calibration</text>
  <text x="1345" y="327" class="sub"   text-anchor="middle">• P(accept | score) from bench</text>
  <text x="1345" y="347" class="sub"   text-anchor="middle">• P(accept | score ± 0.5)</text>
  <text x="1345" y="367" class="sub"   text-anchor="middle">• percentile vs. prior runs</text>
  <text x="1345" y="388" class="tag"   text-anchor="middle">anchored to human scale</text>

  <!-- Edges: paper -> two reviewers -->
  <path class="edge" d="M190 295 C 240 250, 250 210, 280 200" marker-end="url(#arrow)"/>
  <path class="edge" d="M190 315 C 240 360, 250 410, 280 420" marker-end="url(#arrow)"/>

  <!-- Reviewers -> Merger -->
  <path class="edge" d="M510 200 C 560 215, 580 235, 600 245" marker-end="url(#arrow)"/>
  <path class="edge" d="M510 420 C 560 405, 580 380, 600 325" marker-end="url(#arrow)"/>

  <!-- Paper -> Merger (grounding) -->
  <path class="edgeDashed" d="M190 340 C 350 340, 470 330, 600 330" marker-end="url(#arrowDashed)"/>
  <text x="395" y="355" class="label" text-anchor="middle" fill="#8a6d3b">paper text (for verification)</text>

  <!-- Merger -> Scorer -->
  <path class="edge" d="M850 285 L 915 285" marker-end="url(#arrow)"/>
  <text x="882" y="272" class="label" text-anchor="middle">review + &lt;context&gt;</text>

  <!-- Scorer <-> Calibration subagent -->
  <path class="edge" d="M1005 370 L 1005 460" marker-end="url(#arrow)"/>
  <text x="995" y="420" class="label" text-anchor="end">retrieval query</text>
  <path class="edge" d="M1075 460 L 1075 370" marker-end="url(#arrow)"/>
  <text x="1085" y="420" class="label" text-anchor="start">anchor set</text>

  <!-- Subagent -> corpus -->
  <path class="edgeDashed" d="M1165 515 L 1215 515" marker-end="url(#arrowDashed)"/>

  <!-- Scorer -> output -->
  <path class="edge" d="M1165 260 L 1235 260" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="630" width="1420" height="110" fill="#fafafa" stroke="#ccc" rx="6" ry="6"/>
  <text x="50" y="660" font-size="16" font-weight="bold" fill="#111">Key design choices:</text>
  <text x="50" y="688" font-size="14" fill="#222">(1) decouple criticism from advocacy via two role-conditioned agents;</text>
  <text x="50" y="710" font-size="14" fill="#222">(2) merger verifies every claim against the paper and emits a compacted &lt;context&gt; block; scorer sees only review + context, never the paper, decoupling scoring from reviewing;</text>
  <text x="50" y="732" font-size="14" fill="#222">(3) scorer assigns score <tspan font-style="italic">relatively</tspan> to retrieved human-reviewed anchors, pre-filtered by an avg-score band — further reducing LLM score-compression bias.</text>
</svg>
