<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d3b"/>
    </marker>
    <style>
      .box { stroke: #333; stroke-width: 1.5; rx: 10; ry: 10; }
      .title { font-size: 15px; font-weight: bold; fill: #111; }
      .sub   { font-size: 12px; fill: #333; }
      .tag   { font-size: 11px; fill: #555; font-style: italic; }
      .edge  { stroke: #333; stroke-width: 1.6; fill: none; }
      .edgeDashed { stroke: #8a6d3b; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
      .label { font-size: 11px; fill: #333; }
      .stageLabel { font-size: 12px; fill: #777; font-weight: bold; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Stage labels -->
  <text x="110"  y="40" class="stageLabel" text-anchor="middle">INPUT</text>
  <text x="395"  y="40" class="stageLabel" text-anchor="middle">STAGE 1 — PARALLEL DUAL-PERSPECTIVE REVIEW</text>
  <text x="725"  y="40" class="stageLabel" text-anchor="middle">STAGE 2 — CALIBRATED MERGING</text>
  <text x="1040" y="40" class="stageLabel" text-anchor="middle">OUTPUT</text>

  <!-- Input paper -->
  <rect x="30" y="260" width="160" height="90" class="box" fill="#eef5ff"/>
  <text x="110" y="295" class="title" text-anchor="middle">Paper</text>
  <text x="110" y="315" class="sub"   text-anchor="middle">(PDF → markdown,</text>
  <text x="110" y="331" class="sub"   text-anchor="middle">refs / appendix stripped)</text>

  <!-- Harsh Critic -->
  <rect x="280" y="140" width="230" height="120" class="box" fill="#ffecec"/>
  <text x="395" y="170" class="title" text-anchor="middle">Harsh Critic Agent</text>
  <text x="395" y="193" class="sub"   text-anchor="middle">Adversarial reviewer.</text>
  <text x="395" y="210" class="sub"   text-anchor="middle">Surfaces weaknesses,</text>
  <text x="395" y="227" class="sub"   text-anchor="middle">flaws, overclaims.</text>
  <text x="395" y="248" class="tag"   text-anchor="middle">high-precision weakness mining</text>

  <!-- Strength Finder -->
  <rect x="280" y="360" width="230" height="120" class="box" fill="#e8f7ec"/>
  <text x="395" y="390" class="title" text-anchor="middle">Strength Finder Agent</text>
  <text x="395" y="413" class="sub"   text-anchor="middle">Neutral / charitable reviewer.</text>
  <text x="395" y="430" class="sub"   text-anchor="middle">Surfaces contributions,</text>
  <text x="395" y="447" class="sub"   text-anchor="middle">novelty, empirical merits.</text>
  <text x="395" y="468" class="tag"   text-anchor="middle">balances negativity bias</text>

  <!-- Merger -->
  <rect x="600" y="240" width="250" height="140" class="box" fill="#fff7e0"/>
  <text x="725" y="272" class="title" text-anchor="middle">Merger Agent</text>
  <text x="725" y="294" class="sub"   text-anchor="middle">Cross-checks each claim</text>
  <text x="725" y="310" class="sub"   text-anchor="middle">against the paper; drops</text>
  <text x="725" y="326" class="sub"   text-anchor="middle">spurious points; consolidates</text>
  <text x="725" y="342" class="sub"   text-anchor="middle">strengths + weaknesses.</text>
  <text x="725" y="366" class="tag"   text-anchor="middle">verification + aggregation</text>

  <!-- Calibration Search subagent -->
  <rect x="600" y="430" width="250" height="110" class="box" fill="#f0e8ff"/>
  <text x="725" y="460" class="title" text-anchor="middle">Calibration-Search Subagent</text>
  <text x="725" y="482" class="sub"   text-anchor="middle">BM25 + dense retrieval</text>
  <text x="725" y="499" class="sub"   text-anchor="middle">over human-review corpus.</text>
  <text x="725" y="520" class="tag"   text-anchor="middle">returns anchor reviews (topic / quality / score)</text>

  <!-- Human review corpus -->
  <rect x="890" y="450" width="180" height="70" class="box" fill="#f5f5f5" stroke-dasharray="4 3"/>
  <text x="980" y="480" class="title" text-anchor="middle">Human-Review</text>
  <text x="980" y="500" class="sub"   text-anchor="middle">Corpus (ICLR reviews)</text>

  <!-- Final output -->
  <rect x="920" y="210" width="240" height="220" class="box" fill="#e6f4ff"/>
  <text x="1040" y="240" class="title" text-anchor="middle">Consolidated Review</text>
  <text x="1040" y="263" class="sub"   text-anchor="middle">• strengths + weaknesses</text>
  <text x="1040" y="283" class="sub"   text-anchor="middle">• calibrated score ∈ [1,10]</text>
  <text x="1040" y="303" class="sub"   text-anchor="middle">• accept / reject decision</text>
  <line x1="945" y1="318" x2="1135" y2="318" stroke="#9bbcd9" stroke-dasharray="3 3"/>
  <text x="1040" y="337" class="sub"   text-anchor="middle" font-weight="bold">Empirical calibration</text>
  <text x="1040" y="357" class="sub"   text-anchor="middle">• P(accept | score) from bench</text>
  <text x="1040" y="377" class="sub"   text-anchor="middle">• P(accept | score ± 0.5)</text>
  <text x="1040" y="397" class="sub"   text-anchor="middle">• percentile vs. prior runs</text>
  <text x="1040" y="418" class="tag"   text-anchor="middle">anchored to human scale</text>

  <!-- Edges: paper -> two reviewers -->
  <path class="edge" d="M190 295 C 240 250, 250 210, 280 200" marker-end="url(#arrow)"/>
  <path class="edge" d="M190 315 C 240 360, 250 410, 280 420" marker-end="url(#arrow)"/>

  <!-- Reviewers -> Merger -->
  <path class="edge" d="M510 200 C 560 215, 580 235, 600 275" marker-end="url(#arrow)"/>
  <path class="edge" d="M510 420 C 560 405, 580 380, 600 345" marker-end="url(#arrow)"/>

  <!-- Paper -> Merger (grounding) -->
  <path class="edgeDashed" d="M190 290 C 380 290, 470 300, 600 305" marker-end="url(#arrowDashed)"/>
  <text x="415" y="283" class="label" fill="#8a6d3b">paper text (for verification)</text>

  <!-- Merger <-> Calibration subagent (tool call) -->
  <path class="edge" d="M690 380 L 690 430" marker-end="url(#arrow)"/>
  <text x="685" y="408" class="label" text-anchor="end">retrieval query</text>
  <path class="edge" d="M760 430 L 760 380" marker-end="url(#arrow)"/>
  <text x="765" y="408" class="label" text-anchor="start">anchor set</text>

  <!-- Subagent -> corpus -->
  <path class="edgeDashed" d="M850 485 L 890 485" marker-end="url(#arrowDashed)"/>

  <!-- Merger -> output -->
  <path class="edge" d="M850 310 L 920 310" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="590" width="1120" height="110" fill="#fafafa" stroke="#ccc" rx="6" ry="6"/>
  <text x="50" y="620" font-size="16" font-weight="bold" fill="#111">Key design choices:</text>
  <text x="50" y="648" font-size="14" fill="#222">(1) decouple criticism from advocacy via two role-conditioned agents;</text>
  <text x="50" y="670" font-size="14" fill="#222">(2) merger verifies every claim against the paper before inclusion;</text>
  <text x="50" y="692" font-size="14" fill="#222">(3) score is assigned <tspan font-style="italic">relatively</tspan> to retrieved human-reviewed anchors, not on an absolute scale — reducing LLM score-compression bias.</text>
</svg>
